{% extends 'cursos/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5" 
     style="background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80'); background-size: cover; background-position: center; border-radius: 1rem;">
    
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg p-4 rounded-4 bg-white">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="bg-primary text-white p-2 rounded-3 font-monospace fs-5">&lt;/&gt;</span>
                    <h3 class="fw-bold text-dark mt-3">Crea tu Cuenta</h3>
                    <p class="text-muted small">Únete a DevCursos y gestiona tus horarios</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 small rounded-3 mb-3">
                        Por favor, corrige los errores señalados abajo.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 text-white shadow-sm mt-3 mb-3">Registrarse</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-bold">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card form p {
        margin-bottom: 1rem;
    }
    .card form label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 0.25rem;
    }
    .card form input {
        display: block;
        width: 100%;
        padding: 0.55rem 0.75rem;
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.5;
        color: #334155;
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
    }
    .card form input:focus {
        color: #334155;
        background-color: #fff;
        border-color: #0ea5e9;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25);
    }
    .helptext, .help-text {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 0.25rem;
        display: block;
    }
</style>
{% endblock %}
