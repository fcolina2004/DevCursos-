<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCursos</title>
    
    <!-- 🌐 Favicon personalizado para la pestaña -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 🎨 Estilos personalizados: Paleta "Frescura Académica" -->
    <style>
        :root {
            --bs-primary: #0EA5E9; /* Turquesa moderno */
            --bs-primary-rgb: 14, 165, 233;
        }
        body {
            background-color: #F8FAFC !important;
            color: #334155;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #1E293B !important;
        }
        .hero-section {
            background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
            color: white;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar Limpia y Dinámica -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <!-- 🚀 Nombre y Logo de la Marca -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'inicio' %}">
                <span class="bg-primary text-white p-1 rounded-2 small font-monospace">&lt;/&gt;</span> 
                <span>Dev<span class="text-info fw-light">Cursos</span></span>
            </a>
            
            <!-- Botón hamburguesa para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    {% if user.is_authenticated %}
                        <li class="nav-item me-3 mb-2 mb-lg-0">
                            <span class="text-white">Hola, <strong class="text-info">{{ user.username }}</strong></span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="POST" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                            </form>
                        </li>
                    {% endif %}
                    <!-- Si no está autenticado, dejamos la barra limpia solo con el logo de DevCursos -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico de cada vista -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
